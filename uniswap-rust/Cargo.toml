[package]
name = "uniswap-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
build = "build.rs"

[features]
default = ["contracts"]
contracts = []

[[bin]]
name = "uniswap-v2-factory"
path = "src/factory.rs"
required-features = ["contracts"]

[[bin]]
name = "uniswap-v2-pair"
path = "src/pair.rs"
required-features = ["contracts"]

[dependencies]
alloy-core = { version = "1.5.7", default-features = false, features = ["sol-types"] }
alloy-primitives = { version = "1.5.7", default-features = false }
pallet-revive-uapi = { version = "0.10", default-features = false }
picoalloc = { version = "5", default-features = false }
polkavm-derive = { version = "0.32" }

[build-dependencies]
cargo-pvm-contract-builder = "0.3.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
overflow-checks = false
